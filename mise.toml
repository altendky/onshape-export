[settings]
# Increase HTTP timeout to reduce flaky tool installation failures.
http_timeout = "120s"
locked = true

[tools]
node = "24"
python = "3.14.5"
"pipx:pre-commit" = "4.6.0"
"aqua:EmbarkStudios/cargo-deny" = "0.19.8"
"github:nextest-rs/nextest" = { version = "0.9.137", version_prefix = "cargo-nextest-" }
cargo-binstall = "1.20.0"
"cargo:lychee" = "0.24.0"
"cargo:mdbook" = "0.5.3"
"aqua:superfly/flyctl" = "0.4.59"

[vars]
all_platforms = "linux-x64,linux-x64-musl,linux-arm64,linux-arm64-musl,macos-x64,macos-arm64,windows-x64"

[tasks.lock-tool]
description = "Install runtime deps and lock a tool for all platforms"
usage = 'arg "<tool>" help="Tool to lock (e.g., node, cargo:mdbook)"'
run = [
  "mise install --yes node python",
  "MISE_LOCKED=0 mise lock --yes --platform {{vars.all_platforms}} -- ${usage_tool?}",
]

[tasks.local-s3]
description = "Start local MinIO S3-compatible storage"
run = "scripts/local-s3.sh"

[tasks.local-run]
description = "Run the app against local MinIO storage"
run = "scripts/run-local.sh"

[tasks.local-env]
description = "Write .env.local from the Onshape 1Password API item"
run = '''
#!/usr/bin/env bash
set -euo pipefail

item="Onshape - Read Only For API"
umask 077
tmp="$(mktemp .env.local.XXXXXXXXXX)"
cleanup() {
  rm -f "$tmp"
}
trap cleanup EXIT

access_key="$(op item get "$item" --fields label="access key")"
secret_key="$(op item get "$item" --fields label="secret key" --reveal)"

{
  printf 'ONSHAPE_ACCESS_KEY=%s\n' "$access_key"
  printf 'ONSHAPE_SECRET_KEY=%s\n' "$secret_key"
} > "$tmp"

chmod 600 "$tmp"
mv "$tmp" .env.local
trap - EXIT

printf 'Wrote .env.local with Onshape credentials (values hidden)\n'
'''
