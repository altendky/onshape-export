[package]
name = "onshape-export"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.98"
aws-credential-types = "1.2.3"
aws-sdk-s3 = { version = "1.88.0", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
axum = "0.8.4"
base64 = "0.22.1"
fastrand = "2.4.1"
hmac = "0.12.1"
http = "1.3.1"
httpdate = "1.0.3"
num-bigint = "0.4.6"
num-rational = "0.4.2"
num-traits = "0.2.19"
reqwest = { version = "0.12.20", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_jcs = "0.2.0"
serde_json = "1.0.140"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite"] }
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6.6", features = ["trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.20.0"
