# Markdownlint configuration
# See: https://github.com/DavidAnson/markdownlint

# This project uses semantic line breaks for better diffs and easier editing.
gitignore: true

config:
  # Disable line length checking; long lines should not be wrapped arbitrarily.
  MD013: false
  # Allow duplicate headings under different parents.
  MD024:
    siblings_only: true
  # Allow bold text used as labeled paragraphs.
  MD036: false
  # Use compact table style.
  MD060:
    style: "compact"
