name: Setup Rust
description: Install Rust toolchain

inputs:
  toolchain:
    description: Rust toolchain version to install
    required: false
    default: ""
  components:
    description: Comma-separated list of components to install
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Resolve Rust toolchain
      id: resolve
      shell: bash
      env:
        INPUT_TOOLCHAIN: ${{ inputs.toolchain }}
      run: |
        if [[ -n "$INPUT_TOOLCHAIN" ]]; then
          toolchain="$INPUT_TOOLCHAIN"
        else
          toolchain="$(awk -F'"' '/^channel = / { print $2; exit }' rust-toolchain.toml)"
        fi

        if [[ -z "$toolchain" ]]; then
          printf 'failed to resolve Rust toolchain\n' >&2
          exit 1
        fi

        printf 'toolchain=%s\n' "$toolchain" >> "$GITHUB_OUTPUT"

    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
      with:
        toolchain: ${{ steps.resolve.outputs.toolchain }}
        components: ${{ inputs.components }}
