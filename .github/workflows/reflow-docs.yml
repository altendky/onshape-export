name: Docs

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: mdBook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: $/.github/actions/setup-rust

      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5

      - run: mise exec -- mdbook build docs
      - run: mise exec -- mdbook test docs
