name: Docs

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: mdBook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: $/.github/actions/setup-rust

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5

      - run: mise exec -- mdbook build docs
      - run: mise exec -- mdbook test docs
