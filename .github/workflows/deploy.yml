name: Deploy

on:
  workflow_dispatch:
    inputs:
      reset_generated_state:
        description: "Delete generated cache objects and generated SQLite state"
        required: false
        default: false
        type: boolean
      reset_catalog_from_seed:
        description: "Replace live SQLite catalog from catalog/v1/models.json"
        required: false
        default: false
        type: boolean
      fresh_database:
        description: "Delete the SQLite database and recreate it from migrations plus catalog seed"
        required: false
        default: false
        type: boolean
      confirm_destructive:
        description: "Required value: WIPE when any reset option is enabled"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ${{ vars.FLY_APP || 'onshape-export' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4

      - name: Validate destructive inputs
        env:
          CONFIRM_DESTRUCTIVE: ${{ inputs.confirm_destructive }}
        run: |
          set -euo pipefail
          destructive="${{ inputs.reset_generated_state == true || inputs.reset_catalog_from_seed == true || inputs.fresh_database == true }}"
          if [ "${destructive}" = "true" ] && [ "${CONFIRM_DESTRUCTIVE}" != "WIPE" ]; then
            printf '%s\n' 'Destructive deploy options require confirm_destructive=WIPE' >&2
            exit 1
          fi

      - name: Build and push image
        id: build
        run: |
          set -euo pipefail
          image_label="deploy-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image="registry.fly.io/${FLY_APP}:${image_label}"
          mise exec -- fly deploy --app "${FLY_APP}" --remote-only --build-only --push --image-label "${image_label}" --yes
          printf 'image=%s\n' "${image}" >> "${GITHUB_OUTPUT}"

      - name: Select app machine
        id: machine
        run: |
          set -euo pipefail
          machines_json="$(mise exec -- fly machine list --app "${FLY_APP}" --json)"
          mapfile -t machines < <(
            MACHINES_JSON="${machines_json}" python - <<'PY'
          import json
          import os

          for machine in json.loads(os.environ["MACHINES_JSON"]):
              if machine.get("config", {}).get("metadata", {}).get("fly_process_group") == "app":
                  print(machine["id"])
          PY
          )
          if [ "${#machines[@]}" -ne 1 ]; then
            printf 'Expected exactly one app machine for deploy maintenance, found %s\n' "${#machines[@]}" >&2
            exit 1
          fi
          printf 'id=%s\n' "${machines[0]}" >> "${GITHUB_OUTPUT}"
          MACHINES_JSON="${machines_json}" MACHINE_ID="${machines[0]}" python - <<'PY' >> "${GITHUB_OUTPUT}"
          import json
          import os

          machines = json.loads(os.environ["MACHINES_JSON"])
          machine = next(item for item in machines if item["id"] == os.environ["MACHINE_ID"])
          previous_image = machine.get("config", {}).get("image")
          if not previous_image:
              raise SystemExit("selected app machine is missing config.image")
          print(f"previous_image={previous_image}")
          PY

      - name: Quiesce app machine
        run: |
          set -euo pipefail
          mapfile -t fly_env < <(
            python - <<'PY'
          import tomllib

          with open("fly.toml", "rb") as config_file:
              env = tomllib.load(config_file).get("env", {})

          for name, value in sorted(env.items()):
              if isinstance(value, bool):
                  value = "true" if value else "false"
              else:
                  value = str(value)
              if "\n" in value:
                  raise SystemExit(f"fly.toml env value for {name} contains a newline")
              print(f"{name}={value}")
          PY
          )
          fly_env_flags=()
          for env_var in "${fly_env[@]}"; do
            fly_env_flags+=(--env "${env_var}")
          done

          for attempt in 1 2 3 4 5; do
            if mise exec -- fly machine update "${{ steps.machine.outputs.id }}" \
              --app "${FLY_APP}" \
              --image "${{ steps.build.outputs.image }}" \
              --command "sleep infinity" \
              "${fly_env_flags[@]}" \
              --restart no \
              --skip-health-checks \
              --wait-timeout 300 \
              --yes; then
              exit 0
            fi
            if [ "${attempt}" -eq 5 ]; then
              exit 1
            fi
            sleep_seconds=$((attempt * 10))
            printf 'fly machine update failed; retrying in %s seconds\n' "${sleep_seconds}" >&2
            sleep "${sleep_seconds}"
          done

      - name: Run deploy maintenance
        timeout-minutes: 20
        run: |
          set -euo pipefail
          maintenance_command="/app/onshape-export ops deploy-maintenance --backup-label ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}"
          if [ "${{ inputs.reset_generated_state }}" = "true" ]; then
            maintenance_command="${maintenance_command} --reset-generated-state"
          fi
          if [ "${{ inputs.reset_catalog_from_seed }}" = "true" ]; then
            maintenance_command="${maintenance_command} --reset-catalog-from-seed"
          fi
          if [ "${{ inputs.fresh_database }}" = "true" ]; then
            maintenance_command="${maintenance_command} --fresh-database"
          fi
          if [ "${{ inputs.reset_generated_state == true || inputs.reset_catalog_from_seed == true || inputs.fresh_database == true }}" = "true" ]; then
            maintenance_command="${maintenance_command} --confirm WIPE"
          fi
          mise exec -- fly ssh console --machine "${{ steps.machine.outputs.id }}" \
            --app "${FLY_APP}" \
            --user onshape-export \
            -C "${maintenance_command}"

      - name: Deploy app
        id: deploy_app
        run: |
          set -euo pipefail
          mise exec -- fly deploy --app "${FLY_APP}" --remote-only --image "${{ steps.build.outputs.image }}" --strategy immediate --yes

      - name: Run ops check
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if mise exec -- fly ssh console --app "${FLY_APP}" --user onshape-export -C "/app/onshape-export ops check"; then
              exit 0
            fi
            if [ "${attempt}" -eq 5 ]; then
              exit 1
            fi
            sleep_seconds=$((attempt * 5))
            printf 'ops check failed; retrying in %s seconds\n' "${sleep_seconds}" >&2
            sleep "${sleep_seconds}"
          done

      - name: Check health endpoint
        run: |
          set -euo pipefail
          curl -fsS "https://${FLY_APP}.fly.dev/healthz"

      - name: Restore previous app after failed deploy
        id: restore_app
        if: ${{ failure() && steps.deploy_app.outcome != 'success' && steps.machine.outputs.previous_image != '' }}
        run: |
          set -euo pipefail
          mise exec -- fly deploy \
            --app "${FLY_APP}" \
            --remote-only \
            --image "${{ steps.machine.outputs.previous_image }}" \
            --strategy immediate \
            --yes

      - name: Check restored health endpoint
        if: ${{ failure() && steps.deploy_app.outcome != 'success' && steps.machine.outputs.previous_image != '' && steps.restore_app.outcome == 'success' }}
        run: |
          set -euo pipefail
          curl -fsS "https://${FLY_APP}.fly.dev/healthz"
