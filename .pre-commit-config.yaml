repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-docker

  - repo: https://github.com/semgrep/pre-commit
    rev: v1.167.0
    hooks:
      - id: semgrep
        args:
          - --config=.semgrep.yml
          - --error
          - --disable-version-check
          - --quiet
          - --skip-unknown-extensions

  - repo: https://github.com/crate-ci/typos
    rev: v1.47.2
    hooks:
      - id: typos

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.1
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.24.0
    hooks:
      - id: lychee-system
        args: ["--no-progress", "--config=.lychee.toml"]
        types: [markdown]

  - repo: https://github.com/Mergifyio/mergify-pre-commit
    rev: 1.1.0
    hooks:
      - id: validate-mergify-config

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        args: [-verbose]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.25.2
    hooks:
      - id: zizmor
        args: [--offline, --no-progress, --min-severity=low]

  - repo: https://github.com/mpalmer/action-validator
    rev: v0.9.0
    hooks:
      - id: action-validator
        args: [-v]
        files: ^\.github/(workflows/.*\.ya?ml|actions/.*/action\.ya?ml)$

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint-docker

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: bash scripts/cargo-pinned.sh fmt --all --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: bash scripts/cargo-pinned.sh clippy --locked --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-nextest
        name: cargo nextest
        entry: bash scripts/cargo-pinned.sh nextest run --locked --all-features
        language: system
        types: [rust]
        pass_filenames: false
        stages: [manual]

      - id: cargo-deny
        name: cargo deny
        entry: bash scripts/cargo-pinned.sh deny check
        language: system
        pass_filenames: false
        stages: [manual]

      - id: mise-lock
        name: mise lock
        entry: mise install --locked --dry-run
        language: system
        files: (^mise\.toml$|^mise\.lock$)
        pass_filenames: false

      - id: mdbook-build
        name: mdbook build
        entry: mise exec -- mdbook build docs
        language: system
        files: ^docs/
        pass_filenames: false

      - id: mdbook-test
        name: mdbook test
        entry: mise exec -- mdbook test docs
        language: system
        files: ^docs/
        pass_filenames: false
