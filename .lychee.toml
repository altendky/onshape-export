# lychee link checker configuration
# https://github.com/lycheeverse/lychee

verbose = "warn"
no_progress = false

cache = true
max_cache_age = "1d"

max_redirects = 10
max_retries = 3
max_concurrency = 16

timeout = 30
retry_wait_time = 2
insecure = false
method = "get"

exclude = [
    "^https?://localhost",
    "^https?://127\\.0\\.0\\.1",
    "^https?://\\[::1\\]",
    "^https?://example\\.(com|org|net)",
    "^https://\\.\\.\\.",
    "^https?://cad\\.onshape\\.com",
    "\\$\\{",
    "\\$%7B",
]

exclude_path = [
    "^target/",
]

extensions = ["md"]
include_fragments = true
include_mail = false
exclude_all_private = true
